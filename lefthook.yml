# Git hooks, managed by Lefthook. Installed via the `prepare` script (runs on
# `pnpm install`). Run `pnpm exec lefthook install` manually if hooks go missing.

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css,md,mdx}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
