name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default. Jobs opt into more only when they need it.
permissions:
  contents: read

# A new push to a branch cancels any running job on that same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Install pnpm as a standalone binary that bundles its own Node, so the
      # runner default Node (older than pnpm 11 needs) cannot fail the install.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          standalone: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & format check
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Dead code and dependency check
        run: pnpm knip
